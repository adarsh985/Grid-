name: GridSense CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-tests:
    name: Simulator & ML Service Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r simulator/requirements.txt -r ml-service/requirements.txt

      - name: Run Simulator pytest suite
        run: PYTHONPATH=. pytest simulator/tests -v

      - name: Run ML Service pytest suite
        run: pytest ml-service/tests -v

  backend-tests:
    name: Backend Typecheck, Jest & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - name: Run Jest & Supertest suite
        working-directory: backend
        run: npm test

      - name: Build backend
        working-directory: backend
        run: npm run build

  frontend-tests:
    name: Frontend Vitest & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest & React Testing Library suite
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

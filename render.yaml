databases:
  - name: gridsense-db
    databaseName: gridsense
    user: gridsense
    plan: free

services:
  - type: web
    name: gridsense-ml
    runtime: python
    plan: free
    rootDir: ml-service
    buildCommand: pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu "torch>=2.2.0" && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CORS_ORIGIN
        value: "*"

  - type: web
    name: gridsense-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gridsense-db
          property: connectionString
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: gridsense-ml
          property: hostport
      - key: JWT_SECRET
        generateValue: true
      - key: INGEST_API_KEY
        generateValue: true
      - key: AUTO_SEED
        value: "true"
      - key: CORS_ORIGIN
        value: "*"

  # Optional background simulator worker (Render `type: worker` requires a paid plan).
  # On the free tier, AUTO_SEED=true populates meters and baseline alerts on startup,
  # and you can stream live telemetry from your Mac with:
  #   BACKEND_INGEST_URL=https://<your-backend>.onrender.com/api/v1/ingest/reading INGEST_API_KEY=... .venv/bin/python -m simulator.cli --live
